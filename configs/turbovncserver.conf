# Passed through to Xvnc by TurboVNC's vncserver wrapper.
# -noserverkeymap disables the QEMU Extended Key Event/LED State RFB
# extensions, which TurboVNC >=3.1 enables unconditionally and which move
# keymap translation to the server (ignoring the client's actual host
# keyboard layout). See https://github.com/novnc/noVNC/issues/1886 and the
# fix at https://github.com/TurboVNC/turbovnc/commit/f683a73.
$serverArgs = "-noserverkeymap";
